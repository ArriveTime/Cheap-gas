<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelPulse | Real-Time Cheapest Gas Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-text: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        button:active {
            transform: translateY(1px);
        }

        #results {
            margin-top: 30px;
        }

        .station-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .station-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .station-info h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .station-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .price-tag {
            font-size: 22px;
            font-weight: 700;
            color: var(--success-text);
            background: var(--success-bg);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">Live Fuel Analytics</span>
        <h1>FuelPulse</h1>
        <p class="subtitle">Enter your zip code to instantly locate local fuel prices.</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="zipInput" placeholder="Enter 5-digit ZIP code..." maxlength="5">
        <button onclick="searchGas()">Find Gas</button>
    </div>

    <div id="results">
        <div class="empty-state">Results will appear here once you search.</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
