<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheap Gas Locator | Real-Time Fuel Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for 100% Free Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-text: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        #map {
            height: 400px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .station-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .station-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .station-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .station-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .station-meta {
            margin-top: 6px;
            font-size: 12px;
            color: #60a5fa;
            font-weight: 500;
        }

        .price-tag {
            font-size: 20px;
            font-weight: 700;
            color: var(--success-text);
            background: var(--success-bg);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            text-align: center;
        }

        .initial-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cheap Gas Locator</h1>
        <p class="subtitle">Real-time local fuel pricing and interactive map layout.</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="zipInput" placeholder="Enter 5-digit ZIP code (e.g., 90210 or 23168)..." maxlength="5">
        <button onclick="searchGas()">Search Area</button>
    </div>

    <div class="main-layout" id="contentArea">
        <div class="initial-message">
            <h3>Enter a ZIP code above to load the live map and local station prices.</h3>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="script.js"></script>
</body>
</html>
